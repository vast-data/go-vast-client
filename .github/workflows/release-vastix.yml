name: Release Vastix

on:
  push:
    branches:
      - main
    paths:
      - vastix/version

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Vastix
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Read version and check release line
      id: meta
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(tr -d '[:space:]' < vastix/version)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

        if [[ ! "$VERSION" =~ ^[0-9]+(-[a-z0-9-]+)?-vast-[0-9]+(\.[0-9]+)*$ ]]; then
          echo "::error::Invalid vastix/version '$VERSION' (expected N-vast-X.Y or N-qualifier-vast-X.Y, e.g. 1-vast-5.4 or 1-beta-vast-5.5)"
          exit 1
        fi

        RELEASE_LINE="${VERSION%%-vast-*}"
        echo "release_line=$RELEASE_LINE" >> "$GITHUB_OUTPUT"
        echo "Vastix version: $VERSION (release line $RELEASE_LINE)"

        EXISTING=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E "^${RELEASE_LINE}-vast-" || true)
        if [ -n "$EXISTING" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "A vastix release for line ${RELEASE_LINE} already exists:"
          echo "$EXISTING"
          echo "Skipping tag creation, build, and release."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No existing release for line ${RELEASE_LINE}; proceeding."
        fi

        if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          echo "Git tag ${VERSION} already exists."
        else
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Skip summary
      if: steps.meta.outputs.skip == 'true'
      run: |
        echo "## Vastix release skipped" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Version \`${{ steps.meta.outputs.version }}\` was not released because release line **${{ steps.meta.outputs.release_line }}** already has a GitHub release." >> "$GITHUB_STEP_SUMMARY"

    - name: Set up Go
      if: steps.meta.outputs.skip != 'true'
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Build VPN server binaries
      if: steps.meta.outputs.skip != 'true'
      run: |
        cd vastix
        chmod +x scripts/build-vpn-binaries.sh
        ./scripts/build-vpn-binaries.sh

    - name: Build Vastix for multiple platforms
      if: steps.meta.outputs.skip != 'true'
      run: |
        cd vastix
        chmod +x scripts/build-multi-platform.sh
        VERSION="${{ steps.meta.outputs.version }}" ./scripts/build-multi-platform.sh

    - name: Generate checksums
      if: steps.meta.outputs.skip != 'true'
      run: |
        cd vastix/dist
        sha256sum vx-* > checksums.txt
        cat checksums.txt

    - name: Create release notes
      if: steps.meta.outputs.skip != 'true'
      run: |
        cat > release_notes.md << EOF
        # Vastix ${{ steps.meta.outputs.version }}

        ## Downloads

        | Platform | Architecture | Binary |
        |----------|--------------|--------|
        | Linux | x86_64 | \`vx-linux-amd64.${{ steps.meta.outputs.version }}\` |
        | Linux | ARM64 | \`vx-linux-arm64.${{ steps.meta.outputs.version }}\` |
        | macOS | Intel | \`vx-darwin-amd64.${{ steps.meta.outputs.version }}\` |
        | macOS | Apple Silicon | \`vx-darwin-arm64.${{ steps.meta.outputs.version }}\` |

        ## Installation

        \`\`\`bash
        # Example: Linux x86_64
        wget https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.version }}/vx-linux-amd64.${{ steps.meta.outputs.version }}
        chmod +x vx-linux-amd64.${{ steps.meta.outputs.version }}
        sudo mv vx-linux-amd64.${{ steps.meta.outputs.version }} /usr/local/bin/vx
        vx
        \`\`\`

        ## Verification

        \`\`\`bash
        sha256sum -c checksums.txt
        \`\`\`

        See [commits](https://github.com/${{ github.repository }}/commits/${{ steps.meta.outputs.version }}) for details.
        EOF

    - name: Create git tag from vastix/version
      if: steps.meta.outputs.skip != 'true' && steps.meta.outputs.tag_exists == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ steps.meta.outputs.tag }}" -m "Vastix ${{ steps.meta.outputs.version }}"
        git push origin "${{ steps.meta.outputs.tag }}"

    - name: Create GitHub Release
      if: steps.meta.outputs.skip != 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        name: Vastix ${{ steps.meta.outputs.version }}
        body_path: release_notes.md
        files: |
          vastix/dist/vx-*
          vastix/dist/checksums.txt
        fail_on_unmatched_files: true

    - name: Release summary
      if: steps.meta.outputs.skip != 'true'
      run: |
        echo "## Vastix release published" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**Version:** ${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
        echo "**Tag:** ${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        ls -lh vastix/dist/vx-* >> "$GITHUB_STEP_SUMMARY"
