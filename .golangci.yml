version: "2"

run:
  concurrency: 4
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/vast-data/go-vast-client

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprintf
    govet:
      disable:
        - inline
    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - Cancelling
        - Cancelled
        - honour
        - unrecognised
        - inbetween
        - BOUNDRY
        - DISBALE
        - RUNING
        - CONTEXTES
        - REFRENCE
    revive:
      rules:
        - name: var-naming
          disabled: true
        - name: context-as-argument
          disabled: true
        - name: error-strings
          disabled: true
    staticcheck:
      checks:
        - all
        - -QF1008
        - -QF1012
        - -QF1001
        - -QF1003
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -SA1019
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
      - path: examples/.*\.go
        linters:
          - errcheck
          - gosec
